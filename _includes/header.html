<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="12" cy="16" r="9" fill="var(--stone-black)"/>
        <circle cx="21" cy="16" r="9" fill="var(--stone-white)" stroke="var(--ink)" stroke-width="1.2"/>
      </svg>
      <span>{{ site.title }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Mở menu">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span></label>
    <nav class="site-nav">
      {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        {% assign cur_url = page.url | relative_url %}
        <a href="{{ item_url }}"{% if cur_url contains item_url %} class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
